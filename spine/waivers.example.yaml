# =====================================================================
# waivers.example.yaml  ·  예외 승인 목록 (만료 있는 우회)
# =====================================================================
# 게이트를 무작정 끄는 게 아니라, 여기에 '만료일 있는 공식 예외'로만 적는다.
# 만료되면 자동으로 다시 막힌다. waiverable: false 게이트는 예외 불가.
# 4가지가 모두 있어야 유효: gate · reason · approved_by · expires_on
# =====================================================================

waivers:
  - gate: check-vuln-threshold
    reason: medium 초과 취약점 1건, 다음 분기 패치로 승인됨
    approved_by: 보안검토위원회
    expires_on: "2026-12-31"
