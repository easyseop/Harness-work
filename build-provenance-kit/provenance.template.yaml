# =====================================================================
# 빌드 출처 (provenance) — 양식
# =====================================================================
# "이 결과물이 어떤 입력으로, 누가, 언제 만들어졌는가"를 적습니다.
# 실제 예시는 provenance.messenger.example.yaml 을 보세요.
# 해시값은 빌드 도구가 만들어 주는 지문(예: sha256)입니다.
# =====================================================================

provenance:
  project: 미정              # 프로젝트 식별값
  source_ref: 미정           # 소스 커밋/태그. 예: v1.0.0 또는 커밋해시
  built_by: 미정             # 누가/무엇이. 예: CI-빌드시스템 또는 빌드담당역할
  built_on: 미정             # 빌드 시각. 예: 2026-06-16T10:00:00Z
  inputs_hash: 미정          # 입력(소스+잠금파일) 지문
  output_hash: 미정          # 결과물 지문

  artifacts:
    lockfile: 미정           # 잠금 파일 위치
    sbom: 미정               # 구성요소 목록 위치

  # 내부망 재빌드 결과 (reproduce 단계에서 채움. 없으면 그대로 둠)
  reproduce:
    rebuilt_output_hash: 미정
