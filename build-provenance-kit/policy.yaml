# =====================================================================
# build-provenance 정책 파일 (policy.yaml)
# =====================================================================
# 빌드 출처에 무엇이 반드시 있어야 하고, 재현성을 어떻게 볼지 정합니다.
# =====================================================================

policy_version: "0.1"

# ---------------------------------------------------------------------
# 1) 출처(provenance)에 반드시 있어야 하는 항목
# ---------------------------------------------------------------------
required_provenance_fields:
  - source_ref        # 어떤 소스(커밋/태그)로 빌드했나
  - built_by          # 누가/무엇이 빌드했나 (역할 또는 빌드시스템명)
  - built_on          # 언제 빌드했나
  - inputs_hash       # 입력(소스+잠금파일)의 지문(해시)
  - output_hash       # 결과물의 지문(해시)

# ---------------------------------------------------------------------
# 2) 잠금/구성요소 요구
# ---------------------------------------------------------------------
artifacts:
  require_lockfile: true     # 의존성 잠금 파일이 있어야 함 (버전 고정)
  require_sbom: true         # 구성요소 목록(SBOM)이 있어야 함

# ---------------------------------------------------------------------
# 3) 재현성(reproducible) 검사
# ---------------------------------------------------------------------
reproducible:
  # 외부망 빌드 결과 해시와 내부망 재빌드 해시가 같아야 하는가
  require_match: true
