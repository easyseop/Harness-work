# =====================================================================
# secure-sdlc 정책 파일 (policy.yaml)
# =====================================================================
# 개발 중 보안 스캔이 "어디까지 허용"인지 기준을 정합니다.
# 이 파일은 보안팀 소유 — 프로젝트가 기준을 임의로 낮출 수 없습니다.
# =====================================================================

policy_version: "0.1"

# ---------------------------------------------------------------------
# 1) 취약점 심각도 기준 (vulnerability)
# ---------------------------------------------------------------------
# 스캔 결과에 이 심각도 이상이 있으면 반입 불가.
vulnerability:
  # 허용 가능한 최고 심각도. 이보다 높은 건 막음.
  # 단계: none < low < medium < high < critical
  max_allowed_severity: medium
  # critical/high 는 몇 건이든 0건이어야 하는지
  block_high_and_critical: true

# ---------------------------------------------------------------------
# 2) 비밀값 스캔 (secret scan)
# ---------------------------------------------------------------------
secret_scan:
  # 비밀값이 1건이라도 발견되면 무조건 막음
  block_if_any: true

# ---------------------------------------------------------------------
# 3) 필수 스캔 종류 — 스캔 보고서에 이 스캔들이 돌았다는 기록이 있어야 함
# ---------------------------------------------------------------------
required_scans:
  - secret_scan              # 비밀값 스캔
  - dependency_scan          # 의존성 취약점 스캔
  # - sast                   # (선택) 정적 코드 분석
