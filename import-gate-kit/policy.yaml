# =====================================================================
# import-gate 정책 파일 (policy.yaml)
# =====================================================================
# 반입 묶음이 "무엇을 갖춰야 통과"인지, 누가 승인해야 하는지 규칙을 정합니다.
# 이 파일은 프로젝트가 임의로 못 바꿉니다(거버넌스 소유).
# =====================================================================

policy_version: "0.1"

# ---------------------------------------------------------------------
# 1) 반입 묶음에 반드시 있어야 하는 구성요소
# ---------------------------------------------------------------------
required_bundle_items:
  - source          # 소스 코드
  - lockfile        # 의존성 잠금 파일 (버전 고정)
  - sbom            # 구성요소 목록 (무엇이 들어있나)
  - contracts       # 솔루션 카드(계약)
  - evidence        # 각 하네스가 만든 검사 증거
  - manifest        # 하네스 매니페스트
  - attestation     # 누가 만들고/검사하고/승인했는지 서명
  - waivers         # 예외 승인 목록 (없으면 빈 목록)

# ---------------------------------------------------------------------
# 2) 역할 분리 (INV-7) — 한 사람이 다 하면 안 됨
# ---------------------------------------------------------------------
role_separation:
  required: true
  # 만든 사람(developer)과 승인한 사람(approver)은 서로 달라야 함
  developer_must_differ_from_approver: true
  # 검사자(verifier)도 별도 권장 (조직 규칙에 따라 강제 가능)
  verifier_should_differ: true
  required_roles:
    - developer     # 만든 사람
    - verifier      # 검사한 사람
    - approver      # 승인한 사람

# ---------------------------------------------------------------------
# 3) 예외 승인(waiver) 규칙 (INV-6) — 조용한 우회 금지
# ---------------------------------------------------------------------
waivers:
  # 게이트 우회는 --no-verify 같은 게 아니라 만료 있는 waiver 로만
  require_expiry: true
  # 만료된 waiver 가 하나라도 있으면 반입 불가
  block_if_expired: true
  required_fields:
    - gate          # 어떤 게이트를 우회하는지
    - reason        # 왜
    - approved_by   # 누가 승인했는지(역할)
    - expires_on    # 언제 만료되는지 (YYYY-MM-DD)

# ---------------------------------------------------------------------
# 4) 모든 필수 증거(requiredForImport)가 통과(passed) 상태여야 함
# ---------------------------------------------------------------------
require_all_evidence_passed: true
