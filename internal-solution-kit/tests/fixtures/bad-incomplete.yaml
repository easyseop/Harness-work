solution:
  alias: messenger
  category: communication
  owner_role: 미정
  description: '사내 쪽지(메모) 발송 시스템. 시스템 계정(SRV_CODE)으로 직원에게 쪽지를 보낸다. SRV_CODE는 연계신청
    후 내부 담당자에게 별도 발급받아야 한다.

    '
capabilities:
- name: send_memo
  description: 직원 1명 이상에게 쪽지를 보낸다 (최대 50명)
  protocol:
    methods:
    - GET
    - POST
    recommended: POST
    encoding_options:
    - MS949
    - UTF-8
    content_type: application/x-www-form-urlencoded
    url_encoding: required
    environments:
    - 개발
    - 스테이징
    - 운영
  input:
  - field: SRV_CODE
    max_len: 6
    required: true
    description: '연계 시스템 코드. 내부 담당자에게 연계신청서로 발급받는다. 값은 외부망 코드·설정 파일에 절대 적지 않는다 (내부망
      주입).

      '
  - field: RECIPIENT
    max_len: 7
    required: true
    description: '받는 사람 직원번호. 여러 명이면 세미콜론(;)으로 구분한다. 최대 50명까지 동시 발송 가능. 예) 1111111;2222222;3333333;

      '
  - field: SEND
    max_len: 7
    required: true
    description: 보내는 사람 직원번호
  - field: TITLE
    max_len: 100
    required: true
    description: '쪽지 제목 (최대 100자). 실제 표시는 [업무명(서버등록명 자동입력)] + 입력한 제목 형태. 앞의 [업무명]은
      시스템이 자동으로 붙이므로 개발자는 제목 부분만 넣는다.

      '
  - field: BODY
    max_len: 2000
    required: true
    description: '쪽지 내용 (최대 2000자). 기본적으로 본문 양끝에 <pre></pre> 태그가 자동 삽입되어 서식이 유지됨 (use_tag
      서버 설정으로 변경 가능, 담당자 협의). 특수문자(< > & %)는 치환 규칙에 따라 변환해 보내야 함(아래 special_chars
      참조).

      '
  - field: SAVEOPTION
    max_len: 1
    required: false
    description: 보낸 편지함 저장 여부. 미지정 시 저장 안 함(기본값). 필요 시 담당자 문의.
  - field: SENDER_ALIAS
    max_len: 10
    required: false
    description: '발신자 표시 이름(별칭). 미입력 시 SEND(직원번호) 기준 실명으로 표시됨. 시스템 발송 시 서비스명 등을 넣을
      수 있음.

      '
  output:
  - field: result_code
    type: string
    description: 처리 결과 코드 (errors 목록 참조)
  errors:
  - code: '0'
    label: OK
    meaning: 정상 처리
  - code: '32'
    label: WRONG_PARAM_ERR
    meaning: 파라미터 형식·길이 오류
  - code: '33'
    label: SRV_CODE_EMPTY_ERR
    meaning: SRV_CODE가 비어 있음
  - code: '34'
    label: RECIPIENT_EMPTY_ERR
    meaning: RECIPIENT(받는 사람)가 비어 있음
  - code: '35'
    label: SEND_EMPTY_ERR
    meaning: SEND(보내는 사람)가 비어 있음
  - code: '36'
    label: TITLE_EMPTY_ERR
    meaning: TITLE(제목)이 비어 있음
  - code: '37'
    label: BODY_EMPTY_ERR
    meaning: BODY(내용)이 비어 있음
  - code: '38'
    label: SYSTEM_NOT_FOUND_ERR
    meaning: SRV_CODE에 해당하는 시스템을 찾을 수 없음 (미등록 또는 오타)
  - code: '48'
    label: SEND_IP_UNREGIST_ERR
    meaning: 호출 서버 IP가 메신저 시스템에 미등록. 내부망 등록 필요.
  - code: '64'
    label: ETC_ERR
    meaning: 기타 오류
  nonfunctional:
    timeout_ms: 3000
    retry_max: 2
    retry_on_codes:
    - '64'
    no_retry_on_codes:
    - '32'
    - '33'
    - '34'
    - '35'
    - '36'
    - '37'
    - '38'
    - '48'
  special_chars:
  - char: <
    send_as: '&lt;'
  - char: '>'
    send_as: '&gt;'
  - char: '&'
    send_as: '%26%2338%3B'
  - char: '%'
    send_as: '%26%2337%3B'
  line_break_handling:
  - BODY에 HTML 태그가 있으면 개행문자를 변환하지 않음
  - BODY에 HTML 태그가 없으면 개행을 <br/> 로 변환
  - 서버 설정 use_tag=1 이면 <pre> 미적용 / use_tag=0 이면 <pre>BODY</pre> 로 감쌈
  link_url_note: 'IE 전용 사이트 링크는 링크 앞에 ''microsoft-ie:'' 접두어를 붙여 변환해야 함 (예: ''microsoft-ie:''
    + 원래 링크 주소). 변환하지 않으면 기본 브라우저(Edge)로 열려 접속 오류가 발생할 수 있음. (IE·Edge 모두 되는 사이트는 변환
    불필요)

    '
  result_note: '리턴값은 ''쪽지 발송 요청에 대한 유효성 검증 결과''이며, 실제 수신자에게 쪽지가 전달됐는지를 보장하지 않는다.

    '
constraints:
- 파일 첨부 불가
- 발신자에 대한 전체회신·회신 불가
- 시스템 메일은 보낸쪽지함에 기록이 남지 않음 (SAVEOPTION 기본값)
- 호출(발신) 서버 IP를 메신저 시스템에 미리 등록해야 함 (모든 서버 IP 등록 필요)
- SRV_CODE는 연계신청서로 발급받은 값만 사용. 임의 값 사용 불가.
recipient_behavior:
- 인증된 수신자 기준 발송 — 지정된 수신자만 확인 가능
- 로그인 중: 쪽지 알림창(팝업/트레이) 표시 + 받은쪽지함 저장
- 로그오프 중: 로그인 시 미열람 쪽지함에서 열람 가능
- 모바일 push 정책에 따라 push 알림도 전송될 수 있음
- 쪽지시스템 사용 중인 직원에 한해 수신 가능
registration_required:
  items:
  - 서버 IP (모든 서버 포함 — 개발·스테이징·운영)
  - 서버 코드(SRV_CODE) — 임의 부여 또는 원 시스템에서 쓰는 코드, 담당자 발급
  - 담당자 이름
  - 담당자 연락처
  - 발신 시스템 업무 용도
  note: '개발서버 테스트는 개발 쪽지시스템에 로그인해야 가능. 테스트 계정 ID/PW = 직원번호/직원번호 (입행 1년 이내면 계정이 없을
    수 있어 타 직원번호 사용).

    '
security:
  forbidden_in_external_zone:
  - 실제 HOST IP 또는 서비스 URL
  - SRV_CODE 실제 값
  - 실제 직원번호(SEND·RECIPIENT 필드에 테스트 실값 사용 금지)
  data_classification: no-customer-data
  note: '개인정보(고객 정보)를 BODY·TITLE에 담지 않는다. 내부 직원 간 업무 알림 목적에만 사용한다.

    '
mode:
  internal_connection_type: http-api
  external_development_mode: mock-only
  internal_adapter_required: true
  adapter_hint: '외부망에서는 Mock 서버로 개발·테스트한다. 실제 연결(HOST·SRV_CODE)은 내부망 config-secret
    하네스에서 주입한다.

    '
verification:
  external_tests:
  - contract-test
  - mock-fixture-test
  internal_tests:
  - adapter-smoke-test
  - ip-registration-check
