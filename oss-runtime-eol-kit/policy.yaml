# =====================================================================
# oss-runtime-eol 정책 파일 (policy.yaml)
# =====================================================================
# 어떤 라이선스를 허용/금지하고, 런타임 수명(EOL)을 어떻게 다룰지 정합니다.
# 🟡 표시 부분을 조직 규칙에 맞게 채우세요.
# =====================================================================

policy_version: "0.1"

# ---------------------------------------------------------------------
# 1) 라이선스 (license)
# ---------------------------------------------------------------------
licenses:
  # 허용 라이선스 목록
  allowed:
    - Apache-2.0
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    # - TBD                  # 🟡 조직이 허용하는 라이선스 추가
  # 금지 라이선스 목록 (있으면 무조건 막음)
  denied:
    - AGPL-3.0
    # - TBD                  # 🟡 조직이 금지하는 라이선스 추가
  # 허용목록에 없는 라이선스를 만나면 어떻게 할지: block(막음) / warn(경고만)
  unknown_action: block

# ---------------------------------------------------------------------
# 2) 수명종료 (EOL)
# ---------------------------------------------------------------------
eol:
  # 이미 EOL 된 런타임/라이브러리가 있으면 막을지
  block_if_eol: true
  # EOL 까지 남은 날이 이 값보다 적으면 경고(반입은 가능, 교체 권고)
  warn_within_days: 180
  # 런타임 EOL 날짜표 (🟡 조직이 쓰는 런타임 기준일자로 채우세요)
  # 형식: 이름@메이저버전: "YYYY-MM-DD"
  runtimes:
    "java@8": "2030-12-31"
    "java@11": "2032-09-30"
    "java@17": "2029-09-30"
    "java@21": "2031-09-30"
    "python@3.8": "2024-10-07"     # 이미 EOL 예시
    "python@3.11": "2027-10-31"
    "node@18": "2025-04-30"
    "node@20": "2026-04-30"
