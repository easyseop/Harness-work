# =====================================================================
# 구성요소 목록 (components) — 양식
# =====================================================================
# 우리가 쓰는 오픈소스 라이브러리와 런타임을 적습니다.
# (의존성 도구의 SBOM 결과를 이 형식으로 옮겨도 됩니다)
# 실제 예시는 components.messenger.example.yaml 을 보세요.
# =====================================================================

components:
  project: 미정              # 프로젝트 식별값
  generated_on: 미정         # 작성일 YYYY-MM-DD

  # 런타임 (언어/실행환경)
  runtimes:
    - name: 미정             # 예: java
      version: 미정          # 메이저 버전. 예: 21

  # 라이브러리 (오픈소스 패키지)
  libraries:
    - name: 미정             # 예: spring-boot
      version: 미정          # 예: 3.2.1
      license: 미정          # 예: Apache-2.0
