  주소:     { group: 내용, abbr: "ADDR",  dtype: CHAR, lengths: ["100", "102", "122", "200", "202", "250", "252"] }
  우편번호: { group: 번호, abbr: "ZIP",   dtype: CHAR, lengths: ["5","6"] }
