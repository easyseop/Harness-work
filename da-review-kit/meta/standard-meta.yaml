# 인포타입 외 허용 끝말 (PPTX 예외): 구분 → 구분코드 도메인으로 간주
# (등급은 자체 도메인으로 등록돼 있으므로 예외에 두지 않음)
end_word_exceptions: { 구분: 구분코드 }

# ---- 인포타입 길이(타입크기) 검증 정책 ----
# 샘플 데이터라 도메인별 길이목록이 불완전 → 기본은 '형식만' 검증(숫자/소수 여부).
# strict_domains 에 든 도메인만 lengths 목록을 강제(년월일=8, 여부=1 처럼 의미상 고정).
length_policy:
  mode: format_only            # format_only(크기는 형식만) | strict(모든 도메인 lengths 강제)
  strict_domains: [년월일, 년월, 여부, 성별, 시각]

pk: { require: true }
audit_columns: { recommended: [sysLstPrcDtm, sysLstUsrNo] }   # english_style=camelCase 에 맞춤
relationship: { forbid_mn_direct: true }

# ---- 표준/비표준 판정 ----
# 우선순위: ① 입력 table.standard(true/false) → ② schema 가 standard_schemas 에 있으면 표준
#           → ③ default_standard (둘 다 없을 때 기본값)
standard_schemas: []          # 예: [DW_DEPOSIT, DW_LOAN] — 비우면 미사용
default_standard: true        # 안 정해진 테이블은 기본 '표준'으로 간주(엄격: 누락 방지)

# ---- 인스턴스코드 정의서 규칙 (업무인스턴스명/코드값) ----
instance_code:
  # 업무인스턴스명 허용 끝말 (인스턴스=~구분코드, 목록성=~코드, 예외 ~여부/~유무)
  name_endings: ["구분코드", "코드", "여부", "유무"]
  yn_endings: ["여부", "유무"]                 # 이 끝말은 코드값 0/1만 허용
  # 단독 사용 금지 단어 12개 (이 단어 단독으로 인스턴스명 불가)
  forbidden_standalone: [자산, 부채, 금액, 연금, 년월일, 여부, 유무, 건수, 명, 시각, 식별자, 현금]
