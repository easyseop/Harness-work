# =====================================================================
# META(표준) 목데이터 · DA 물리검토 기준 (가짜 표준 — 실데이터 아님)
# 실제 메타시스템 구조에 맞춤: 컬럼한글명 / 속성명 / 도메인 / 인포타입 / 타입길이 / NULL / 표준화적용여부
#
# [개념]  도메인 = 재사용 의미단위(성별·년월일·금액…)  ·  인포타입 = 도메인+길이(년월일8)
#         컬럼 = [수식어]+[도메인 끝말]  ·  컬럼은 반드시 도메인(인포타입)으로 끝남
# =====================================================================

# ---- 테이블 명명규칙 ----
naming:
  table:
    pattern: "^T[HS][A-Z]{3}[A-Z]{2}[0-9]{2}$"   # T+시스템(H/S)+앱(3)+소그룹(2)+일련(2)
    system_codes: { H: Host DB2, S: Server }
  valid_app_codes:                 # 어플리케이션코드(3) — 업무 도메인
    DPS: 수신/예금
    LON: 여신/대출
    CUS: 고객
    ACC: 회계/계정
    CRD: 카드
    FXD: 외환
    FUN: 펀드/신탁
    INS: 보험
    PAY: 지급결제
    RSK: 리스크
    MKT: 마케팅
    CHN: 채널/단말
    CMM: 공통
  valid_subgroup_codes:            # 업무소그룹코드(2) — 최하위 주제영역
    AA: 잔액
    AB: 거래내역
    AC: 약정
    BA: 계좌
    BB: 상품
    CA: 고객기본
    CB: 고객부가
    DA: 집계/통계
    EA: 공통코드
    FA: 한도
    GA: 채널

# ---- 컬럼 명명규칙 ----
column:
  require_korean: true
  require_english: true
  require_infotype: true
  must_end_with_domain: true       # 컬럼은 인포타입(도메인)으로 끝나야 함 (PPTX)
  forbid_trailing_digit: false     # 끝자리 숫자 허용(조직 결정) — 매칭 시 끝 숫자는 무시
  korean_max_chars_server: 15      # Server 한글 최대 15자 (Host 10자) / 30byte
  english_style: camelCase         # 영문변수명 규칙: camelCase(첫글자 소문자, 고객성별→custSex) / upper_snake(CUST_SEX)

# ---- 수식어 표준단어 (한글 → 영문약어) ----
standard_words:
  # 주체/조직
  고객: CUST
  직원: EMP
  지점: BR
  부점: BR
  회사: CORP
  그룹: GRP
  은행: BANK
  # 업무
  계좌: ACCT
  예금: DPST
  대출: LOAN
  상품: PRD
  거래: TRD
  신용: CRDT
  잔액: BAL
  # 한정/상태
  기준: BASE
  적용: APLY
  시작: BGN
  종료: END
  등록: REG
  변경: CHG
  상태: STAT
  한글: KOR
  영문: ENG
  # 업무 (추가)
  수신: RCV
  여신: LEND
  외환: FX
  카드: CARD
  펀드: FUND
  신탁: TRST
  보험: INSU
  투자: INVT
  이체: TRNF
  송금: REMT
  입금: DEPI
  출금: WDRW
  상환: RPMT
  연체: OVDU
  승인: APRV
  취소: CNCL
  신청: APPL
  접수: RCPT
  발급: ISSU
  한도: LIMIT
  만기: MTRT
  개설: OPEN
  해지: CLSE
  # 한정/집계 (추가)
  누적: ACCM
  합계: TOTL
  평균: AVRG
  당월: CMTH
  전월: PMTH
  신규: NEW
  기존: EXST
  대상: TGT
  직전: PREV
  현재: CURR
  최초: FRST
  # 시스템 공통
  시스템: SYS
  최종: LST
  처리: PRC
  사용자: USR

# ---- 도메인 사전 (= 재사용 단위). 도메인그룹 9개 기반. 인포타입 = 도메인+길이 ----
