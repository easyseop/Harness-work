domains:
  # [코드 그룹]
  코드:     { group: 코드, abbr: "CD",    dtype: CHAR, lengths: ["1", "2", "3", "4", "5", "6", "7", "8", "10", "12", "13", "14", "15", "16", "20", "40"], is_code: true }
