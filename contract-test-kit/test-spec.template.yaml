# =====================================================================
# 계약 테스트 명세 (test-spec) — 양식
# =====================================================================
# 솔루션 카드의 약속을 "테스트 케이스"로 옮겨 적는 표입니다.
# 각 케이스는 "이 입력을 주면 이 결과(또는 이 오류)가 나와야 한다" 입니다.
# 실제 예시는 test-spec.messenger.example.yaml 을 보세요.
# 테스트 데이터는 가짜 값만 씁니다 (실제 직원번호·고객정보 금지).
# =====================================================================

test_spec:
  for_solution: 미정          # 어떤 솔루션 카드(별칭)인지. 예: messenger
  capability: 미정            # 검증할 기능 이름. 예: send_memo
  owner_role: 미정

  cases:
    - id: 미정                # 케이스 식별값. 예: happy-path-1
      type: 미정              # happy(정상) / error(오류) / missing-field(필수누락)
      given:                  # 입력 (가짜 값만)
        미정: 미정
      expect:                 # 기대 결과
        result_code: 미정     # 예: "0" (정상) 또는 "34" (오류코드)
      note: 미정
