# =====================================================================
# policy.yaml  ·  policy-profile 하네스의 조직 정책
# =====================================================================
# 🟡 여기는 "우리 조직이 허용/금지하는 규칙"을 적는 곳입니다.
#    - 비밀정보 아님. 그냥 정책 사실만 적습니다. (예: "자바 21 허용")
#    - TBD 라고 적힌 줄을 실제 값으로 바꾸세요.
#    - 모르는 항목은 비워두지 말고 FILL-GUIDE.md 를 보거나 담당자에게 물어보세요.
#    - ❌ 실제 IP/URL/secret/직원ID/고객데이터는 절대 적지 않습니다. (SAFE-OR-NOT.md 참고)
# ---------------------------------------------------------------------

policy_version: "0.1"        # 이 정책 파일의 버전 (그대로 두세요)

# ---------------------------------------------------------------------
# 1. 허용 기술스택  ·  "우리가 개발에 써도 되는 것"
# ---------------------------------------------------------------------
allowed_tech_stack:

  languages:                 # 허용 프로그래밍 언어 + 버전
    - TBD                    # 예: java-21
    # - python-3.11
    # - node-20

  frameworks:                # 허용 프레임워크 (없으면 '없음' 한 줄)
    - TBD                    # 예: spring-boot-3
    # - n-framework          #     (행내 코어뱅킹 프레임워크)
    # - 없음

  deploy_units:              # 산출물 형태
    - TBD                    # 예: jar  (선택지: 소스 / jar / war / 컨테이너 / 스크립트)

  deploy_targets:            # 배포되는 실행환경
    - TBD                    # 예: 온프레미스  (선택지: 온프레미스 / VM / kubernetes / 레거시-WAS / 배치-스케줄러)

# ---------------------------------------------------------------------
# 2. 오픈소스 라이선스 정책  ·  "이 라이선스는 막는다 / 검토한다"
# ---------------------------------------------------------------------
licenses:
  denied:                    # 사용 금지 라이선스
    - AGPL-3.0               # 예시 (조직 기준으로 수정)
    - GPL-3.0
  review_required:           # 사용 전 검토 필요
    - LGPL-3.0
    - MPL-2.0

# ---------------------------------------------------------------------
# 3. 취약점 차단 기준  ·  "이 등급 이상은 막는다"
# ---------------------------------------------------------------------
vulnerabilities:
  block_severity:            # 이 심각도는 반입 차단
    - critical
    - high
  allow_waiver: true         # 예외 승인(waiver)으로 통과 허용할지

# ---------------------------------------------------------------------
# 4. 반입 방식  ·  "어떤 형태로 내부에 들여올 수 있나"
# ---------------------------------------------------------------------
allowed_import_methods:
  - TBD                      # 예: 소스반입  (선택지: 소스반입 / artifact반입 / 이미지반입 / manifest반입 / hybrid)

# ---------------------------------------------------------------------
# 5. 승인 역할  ·  "누가 반입/배포를 승인하나" (역할 이름만, 사람 이름 X)
# ---------------------------------------------------------------------
approval_roles:
  import_approver: TBD       # 예: 보안검토위원회
  deploy_approver: TBD       # 예: 변경관리팀
