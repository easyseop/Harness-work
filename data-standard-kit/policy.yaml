# =====================================================================
# policy.yaml  ·  data-standard 하네스의 데이터 표준 정책
# =====================================================================
# 🟡 "우리 조직의 데이터 표준 규칙"을 적는 곳입니다. 비밀 아님.
#    TBD 를 실제 규칙으로 바꾸세요. 모르면 FILL-GUIDE.md 참고.
# ---------------------------------------------------------------------

policy_version: "0.1"

# ---------------------------------------------------------------------
# 1. 이름 규칙  ·  "테이블·컬럼 이름은 이렇게 짓는다"
#    값은 정규식(이름이 맞는지 자동 검사하는 패턴)입니다.
# ---------------------------------------------------------------------
naming:
  # 테이블 명명규칙: T + (시스템 D/C/K) + 앱코드3자 + 식별부2자 + 일련번호2자
  #   ① T 고정  ② D=DW C=Core K=그외  ③ 대문자 3자  ④ 알파벳+숫자 또는 알파벳2자  ⑤ 숫자 2자
  #   예: TCABCX901  (T-C-ABC-X9-01)
  table_pattern: "^T[DCK][A-Z]{3}[A-Z][A-Z0-9][0-9]{2}$"
  # 컬럼 명명규칙은 따로 없음 → 검사 안 함(빈 값)
  column_pattern: ""
  # 접두사는 패턴(T...)에 이미 포함되므로 별도 목록 없음
  table_prefixes: []

# ---------------------------------------------------------------------
# 2. 반드시 채워야 하는 메타데이터  ·  "이 정보 없으면 안 됨"
#    (조직 답변 반영: 책임역할/등급/보관기간은 강제 안 함)
# ---------------------------------------------------------------------
required_metadata:
  - standard                  # 표준/비표준 여부 (true/false) — 반드시 선언 (값 검사 적용 기준)
  - schema                    # 스키마명
  - description               # 테이블 정의(설명)

# ---------------------------------------------------------------------
# 3. 허용 데이터 등급  ·  별도 등급 체계 없음 → 빈 목록이면 검사 건너뜀
# ---------------------------------------------------------------------
allowed_classifications: []

# ---------------------------------------------------------------------
# 4. lineage(흐름) 요구  ·  조직 답변: 안 씀 → false
# ---------------------------------------------------------------------
require_lineage: false

# ---------------------------------------------------------------------
# 5. 값 검사 규칙  ·  "실제 데이터 값이 유효한지" 검사 (핵심)
#    컬럼의 type / valid_values 를 보고 적재된 값을 검사한다.
# ---------------------------------------------------------------------
value_rules:
  # type 이 date8 인 컬럼: 값이 유효한 YYYYMMDD(8자리, 실제 달력 날짜)여야 함
  date8_type: "date8"
  # 컬럼에 valid_values 목록이 있으면(=인스턴스 식별자): 값이 그 목록 안이어야 함
  enforce_valid_values: true
