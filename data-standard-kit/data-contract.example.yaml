# =====================================================================
# 예시  ·  일별 예금 잔액 집계 테이블 (가짜 표준 예시, 실제 데이터 없음)
# 명명규칙: TDDPSX901 = T-D(DW)-DPS(예금앱)-X9(식별부)-01(일련)
# =====================================================================

dataset:
  name: TDDPSX901
  type: table
  standard: true              # 표준 DB(테이블) 여부 — true 일 때만 값 기준을 강제함
  schema: DW_DEPOSIT          # 스키마명 (필수)
  description: 일별 예금 잔액 집계   # 테이블 정의 (필수)

columns:
  # --- 년월일8 컬럼: 값이 유효한 YYYYMMDD 여야 함 (13월·32일 등은 오류) ---
  - name: BASE_YMD
    type: date8
    nullable: false
    description: 집계 기준일자 (YYYYMMDD)

  - name: ACCT_ID
    type: string
    nullable: false
    description: 계좌 식별값(가명 처리)

  # --- 인스턴스 식별자 컬럼: valid_values 목록 안의 값만 허용 (0 들어오면 오류) ---
  - name: ACCT_STAT_CD
    type: code
    instance_identifier: true
    valid_values: [1, 2, 3, 4]   # 인스턴스 유효식별자 목록
    nullable: false
    description: 계좌상태코드 (1정상 2휴면 3해지 4압류)

  - name: BAL_AMT
    type: decimal
    nullable: false
    description: 해당 일자 잔액 합계
