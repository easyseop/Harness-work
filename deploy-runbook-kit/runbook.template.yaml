# =====================================================================
# 배포 안내서 (runbook) — 양식
# =====================================================================
# 내부망에 배포하는 절차를 단계별로 적습니다.
# ⚠️ 실제 서버 주소·접속코드·비밀번호는 절대 적지 않습니다 (빈 자리/역할로).
# 실제 예시는 runbook.messenger.example.yaml 을 보세요.
# =====================================================================

runbook:
  project: 미정              # 프로젝트 식별값
  owner_role: 미정           # 배포 책임 역할

  precheck:                  # 사전 점검 (배포 전 확인)
    - 미정

  deploy:                    # 배포 절차 (순서대로)
    - 미정

  verify:                    # 배포 후 검증 (정상 동작 확인)
    - 미정

  rollback:                  # 롤백 절차 (문제 시 되돌리기)
    - 미정

  contacts:                  # 비상 연락 (역할 기준, 실제 이름 X)
    - role: 미정
      when: 미정             # 언제 연락하는지
