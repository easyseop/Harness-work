harness: deploy-runbook
cases:
  - name: 완전한 런북은 통과
    gate: check-runbook-complete
    input: tests/fixtures/good.yaml
    expect: pass
  - name: 롤백 비면 막혀야
    gate: check-runbook-complete
    input: tests/fixtures/bad-norollback.yaml
    expect: fail
  - name: 비밀값 없으면 통과
    gate: check-no-secrets-in-runbook
    input: tests/fixtures/good.yaml
    expect: pass
  - name: 실제 IP 있으면 막혀야
    gate: check-no-secrets-in-runbook
    input: tests/fixtures/bad-ip.yaml
    expect: fail
