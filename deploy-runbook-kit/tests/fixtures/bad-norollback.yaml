runbook:
  project: PRJ-2026-014
  owner_role: 운영팀
  precheck:
  - 반입 묶음(import-gate)이 통과되었는지 확인
  - 설정 빈 자리(MESSENGER_HOST, MESSENGER_SRV_CODE)가 내부망 설정에 주입되었는지 확인
  - 발신 서버 IP가 메신저 시스템에 등록되었는지 확인 (미등록 시 오류 48)
  - 직전 버전 백업 존재 확인
  deploy:
  - 신규 버전 산출물을 대상 환경에 배치
  - 설정 주입 적용 (빈 자리 → 실제 값, 외부망 코드 수정 없음)
  - 서비스 재기동
  - 기동 로그에 오류 없는지 확인
  verify:
  - 헬스체크 정상 응답 확인
  - 테스트 쪽지 1건 발송 → 결과코드 0(OK) 확인
  - 오류코드 처리 동작 1건 확인 (예: 필수누락 → 34/35/36/37)
  - 모니터링 지표(응답시간·에러율) 정상 범위 확인
  rollback:
  - 미정
  contacts:
  - role: 운영팀 당직
    when: 배포 중 장애 발생 시 1차
  - role: 내부플랫폼팀
    when: 메신저 시스템 연계 오류(38/48) 지속 시
  - role: 반입승인책임자
    when: 롤백 결정이 필요한 경우
