# Harness Manifest Template
# 새 capability 하네스를 만들 때 이 파일을 복사해 채운다.
# 규격: 00-spine-and-manifest-spec.md §2
# 규칙: 실제 endpoint/secret/고객정보 금지. TBD는 이 템플릿에서만 허용.

manifestVersion: "0.1"          # 고정 (Spine 호환성 기준)
id: TBD                          # 소문자-하이픈 고유 id
version: "0.1.0"                 # semver
title: "TBD 하네스"
owner: TBD-team
status: draft                    # draft | active | deprecated

hooks:                           # 참여 단계: classify | build | verify | import | reproduce
  - TBD

requires: []                     # 먼저 실행돼야 하는 하네스 id 목록
optional: []                     # 있으면 연동, 없어도 동작

inputs:
  - name: requirements
    from: spine                  # spine | harness:<id> | bundle
    required: true

policy:
  file: policy.yaml
  overridable: true

gates:
  - id: TBD-check
    phase: verify                # 이 게이트가 도는 단계
    blocking: true               # true=실패 시 중단, false=경고
    waiverable: true
    runner: gates/TBD-check.sh

evidence:
  - id: TBD-evidence
    path: TBD.json
    schema: schemas/TBD.schema.json
    requiredForImport: true

traceability:
  emits: [evidence]              # requirement | design | code | evidence 중

appliesWhen: []                  # 비우면 항상 적용
