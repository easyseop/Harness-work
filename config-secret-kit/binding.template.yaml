# =====================================================================
# 바인딩 목록 (binding) — 양식
# =====================================================================
# "코드가 쓰는 빈 자리"를 1개씩 적는 표입니다.
# 외부망에서는 이름·종류·설명만 적고, 실제 값은 적지 않습니다.
# 내부망 반입 시 source 에서 실제 값을 꽂습니다.
# 모르는 칸은 FILL-GUIDE.md 를 보세요.
# =====================================================================

binding:
  for_solution: 미정          # 어떤 솔루션 카드(별칭)의 빈 자리인지. 예: messenger
  owner_role: 미정            # 이 바인딩 책임 역할

  variables:
    - name: 미정              # 빈 자리 이름 (대문자_스네이크). 예: MESSENGER_HOST
      kind: 미정              # config 또는 secret
      zone: 미정              # external-ok 또는 internal-only
      required: true          # 반드시 필요한 값인지
      default: null           # config 일 때만 기본값 가능. secret 은 항상 null
      source: 미정            # 내부망에서 실제 값을 어디서 가져오는지(설명, 실제 값 X)
      description: 미정        # 이 값이 무엇인지 한 줄 설명
